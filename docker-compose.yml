# Local PostgreSQL for trying the Cost Engine:  docker compose up -d
# Matches the default DATABASE_URL in .env.example
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: united_cost_engine
    ports:
      - "5432:5432"
    volumes:
      - cost-engine-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d united_cost_engine"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  cost-engine-db:
